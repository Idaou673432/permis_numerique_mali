<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008543" />
      <stop offset="100%" stop-color="#006633" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#gradGreen)" />

  <!-- Mali Flag Stripes at the top curve -->
  <g opacity="0.95">
    <rect x="0" y="0" width="170.6" height="16" fill="#008543" />
    <rect x="170.6" y="0" width="170.6" height="16" fill="#FCD116" />
    <rect x="341.2" y="0" width="170.8" height="16" fill="#CE1126" />
  </g>

  <!-- Central Shield -->
  <g filter="url(#dropShadow)">
    <path d="M 256 90 
             C 340 90, 390 120, 390 180 
             C 390 310, 256 390, 256 420 
             C 256 390, 122 310, 122 180 
             C 122 120, 172 90, 256 90 Z" 
          fill="url(#shieldGrad)" 
          stroke="#008543" 
          stroke-width="10" />
  </g>

  <!-- Mali Flag Tricolor inside Shield Header -->
  <clipPath id="shieldClip">
    <path d="M 256 98 
             C 334 98, 380 126, 380 182 
             C 380 304, 256 380, 256 410 
             C 256 380, 132 304, 132 182 
             C 132 126, 178 98, 256 98 Z" />
  </clipPath>

  <g clip-path="url(#shieldClip)">
    <rect x="130" y="98" width="84" height="24" fill="#008543" />
    <rect x="214" y="98" width="84" height="24" fill="#FCD116" />
    <rect x="298" y="98" width="84" height="24" fill="#CE1126" />
  </g>

  <!-- Driving Wheel & QR Code Icon Fusion -->
  <!-- Steering wheel circle -->
  <circle cx="256" cy="245" r="76" fill="none" stroke="#008543" stroke-width="12" />
  <circle cx="256" cy="245" r="28" fill="#008543" />

  <!-- Steering wheel spokes -->
  <line x1="184" y1="245" x2="228" y2="245" stroke="#008543" stroke-width="10" stroke-linecap="round" />
  <line x1="284" y1="245" x2="328" y2="245" stroke="#008543" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="273" x2="256" y2="317" stroke="#008543" stroke-width="10" stroke-linecap="round" />

  <!-- Verification Checkmark / Security Star inside hub -->
  <path d="M 248 245 L 253 250 L 264 239" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text DNTT MALI -->
  <text x="256" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#008543" text-anchor="middle" letter-spacing="2">DNTT MALI</text>
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#64748B" text-anchor="middle" letter-spacing="1">PERMIS NUMÉRIQUE</text>
</svg>
