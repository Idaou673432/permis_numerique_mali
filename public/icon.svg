<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" />
    </clipPath>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
  </defs>

  <!-- Clean App Icon Base Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Clean Permis Mali Circular Medallion -->
  <g clip-path="url(#squircle)">
    <image xlink:href="/app_icon.png" x="16" y="16" width="480" height="480" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
